[package]
name = "monaged"
version = "0.9.4"
edition = "2024"
publish = false
description = "Monaged: run Claude Code agents on your projects, inside WSL, from one native window"
license-file = "LICENSE"
repository = "https://github.com/Marten-Mrfc/monaged"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
# Exports: a zip (deflate) and a screenshot of the window (PNG).
crc32fast = "1"
flate2 = "1"
futures = "0.3"
# Tokens for the local bridge, from the operating system's random source.
getrandom = "0.3"
gpui = "=0.2.2"
keyring = "4.2.0"
png = "0.18"
pulldown-cmark = { version = "0.13.6", default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
unicode-segmentation = "1"
ureq = { version = "3.5.2", features = ["json"] }

# Windows' own APIs (registry, shortcuts, running as administrator) instead of
# helper programs like PowerShell or reg.exe; the same version GPUI uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = "limited"

# Dependencies change rarely: build them optimized without debug info so the
# UI stays smooth in dev builds and linking stays fast.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Release builds: smaller and a little faster, without slowing CI down much.
[profile.release]
codegen-units = 4
strip = "debuginfo"

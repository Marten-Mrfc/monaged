name: Release

# Builds the Windows release and publishes it as the GitHub release v<version>
# (the version in Cargo.toml), in either of two ways:
#   - push a tag like v0.3.0, or
#   - push a commit whose message starts with "Release v0.3.0" to main or a
#     claude/ branch (the workflow then creates the tag on that commit).
# Running it by hand builds the same files as a workflow artifact without
# publishing anything.
on:
  push:
    tags: ["v*"]
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and package (Windows x64)
    if: github.event_name != 'push' || github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}-release
          restore-keys: windows-cargo-${{ hashFiles('Cargo.lock') }}-
      - name: Version
        id: version
        shell: pwsh
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
          }
          $publish = 'false'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $publish = 'true' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'branch') {
            $subject = ($env:HEAD_MESSAGE -split "`n")[0].Trim()
            if ($subject -notmatch "^Release v$([regex]::Escape($version))\b") {
              throw "The commit says '$subject' but Cargo.toml's version is $version"
            }
            $publish = 'true'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Monaged $version"
      # In release mode, so the tests share their build with the release itself.
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version "${{ steps.version.outputs.version }}" -Out dist-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: monaged-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*
            dist-notes.md
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

  publish:
    # Publishing runs on Linux: the Windows job's release call was refused
    # (403) where the same call from Linux works.
    name: Publish the GitHub release
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: monaged-${{ needs.release.outputs.version }}-windows-x64
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          ls -la out out/dist
          # SHA256SUMS.txt comes from PowerShell, with Windows line endings.
          (cd out/dist && tr -d '\r' < SHA256SUMS.txt | sha256sum -c -)
          pre=--latest
          case "$VERSION" in *-*) pre=--prerelease ;; esac
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" out/dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file out/dist-notes.md
          else
            gh release create "v$VERSION" out/dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Monaged $VERSION" --notes-file out/dist-notes.md $pre
          fi
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'

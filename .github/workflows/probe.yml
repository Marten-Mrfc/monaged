name: Token probe (temporary)

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    steps:
      - name: Which release call is refused?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=$GITHUB_REPOSITORY; N=$GITHUB_RUN_ID
          echo "--- 1. tag ref matching v*"
          gh api -X POST repos/$R/git/refs -f ref=refs/tags/v0.0.0-probe$N -f sha=$GITHUB_SHA >/dev/null && echo "V TAG OK" && gh api -X DELETE repos/$R/git/refs/tags/v0.0.0-probe$N || echo "V TAG FAILED"
          echo "--- 2. published release, probe tag"
          id=$(gh api -X POST repos/$R/releases -f tag_name=probe-pub-$N -f target_commitish=$GITHUB_SHA -F draft=false -F prerelease=true -f name=probe --jq .id) && echo "PUBLISHED OK" && gh api -X DELETE repos/$R/releases/$id || echo "PUBLISHED FAILED"
          gh api -X DELETE repos/$R/git/refs/tags/probe-pub-$N 2>/dev/null || true
          echo "--- 3. draft release, v* tag"
          id=$(gh api -X POST repos/$R/releases -f tag_name=v0.0.1-probe$N -f target_commitish=$GITHUB_SHA -F draft=true -f name=probe --jq .id) && echo "V DRAFT OK" && gh api -X DELETE repos/$R/releases/$id || echo "V DRAFT FAILED"
          echo "--- 4. existing release v0.3.0?"
          gh release view v0.3.0 --repo $R --json tagName,isDraft 2>&1 || true
          gh api repos/$R/rulesets --jq '.[] | {name, target, enforcement}' 2>&1 || true

name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "marketing/**", "**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}-ci
          restore-keys: windows-cargo-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked -- -D clippy::correctness

  package:
    name: Package (dry run of a release)
    # Pushes whose message contains [package] build the release files as an
    # artifact, without publishing anything.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[package]')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}-release
          restore-keys: windows-cargo-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          ./scripts/package.ps1 -Version $version
          ./scripts/release-notes.ps1 -Version $version -Out dist-notes.md
          Get-Content dist-notes.md
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: monaged-package
          path: |
            dist/*
            dist-notes.md
          if-no-files-found: error

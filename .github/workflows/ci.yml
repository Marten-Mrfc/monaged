name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "marketing/**", "**.md"]
  pull_request:
  workflow_dispatch:

# One run per commit: the same commit pushed to a branch and to main moments
# later would otherwise build twice; the later push takes over.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test (Windows)
    # A "Release v…" commit is built and tested by the Release workflow.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      # Keyed on Cargo.lock but falling back to the newest cache, so a version
      # bump rebuilds only Monaged itself, not GPUI and every other dependency.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug
      # Builds the app (as its test binary) and runs the tests; Clippy below
      # checks the app build itself.
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked -- -D clippy::correctness

  package:
    name: Package (dry run of a release)
    # Pushes whose message contains [package] build the release files as an
    # artifact, without publishing anything.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[package]')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          ./scripts/package.ps1 -Version $version
          ./scripts/release-notes.ps1 -Version $version -Out dist-notes.md
          Get-Content dist-notes.md
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: monaged-package
          path: |
            dist/*
            dist-notes.md
          if-no-files-found: error
